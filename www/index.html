<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ChitraBook AI Login</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
background: radial-gradient(circle at top,#1e293b,#0f172a);
}

.glass{
background: rgba(255,255,255,0.05);
backdrop-filter: blur(15px);
border:1px solid rgba(255,255,255,0.1);
}

.link{
color:#818cf8;
cursor:pointer;
}

.link:hover{
text-decoration:underline;
}

.helper-row{
display:flex;
align-items:center;
justify-content:flex-end;
margin-top:-0.5rem;
margin-bottom:1rem;
}

.feedback{
display:none;
margin-top:1rem;
padding:0.85rem 1rem;
border-radius:0.85rem;
font-size:0.9rem;
line-height:1.5;
border:1px solid rgba(255,255,255,0.08);
}

.feedback.show{
display:block;
}

.feedback.info{
background:rgba(99,102,241,0.12);
border-color:rgba(99,102,241,0.3);
color:#c7d2fe;
}

.feedback.success{
background:rgba(34,197,94,0.12);
border-color:rgba(34,197,94,0.28);
color:#bbf7d0;
}

.feedback.error{
background:rgba(239,68,68,0.12);
border-color:rgba(239,68,68,0.28);
color:#fecaca;
}


.legal-agreement{
  margin-top:0.2rem;
  margin-bottom:1rem;
  display:flex;
  gap:0.6rem;
  align-items:flex-start;
  font-size:0.76rem;
  line-height:1.45;
  color:rgba(203,213,225,0.86);
}

.legal-agreement input{
  margin-top:0.16rem;
  width:1rem;
  height:1rem;
  accent-color:#6366f1;
  flex:0 0 auto;
}

.legal-agreement a,
.legal-consent a{
  color:#a5b4fc;
  font-weight:700;
}

.legal-agreement a:hover,
.legal-consent a:hover{
  text-decoration:underline;
}

.legal-consent{
  margin-top:0.9rem;
  text-align:center;
  font-size:0.72rem;
  line-height:1.5;
  color:rgba(203,213,225,0.78);
}

.legal-overlay{
  position:fixed;
  inset:0;
  z-index:2147483647;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:1rem;
  background:rgba(2,6,23,0.9);
  backdrop-filter:blur(12px);
}

.legal-modal{
  width:min(100%, 430px);
  border-radius:1.35rem;
  padding:1.2rem;
  background:rgba(15,23,42,0.98);
  border:1px solid rgba(255,255,255,0.12);
  box-shadow:0 28px 90px rgba(0,0,0,0.45);
}

.legal-modal-badge{
  display:inline-flex;
  align-items:center;
  padding:0.36rem 0.7rem;
  border-radius:999px;
  font-size:0.7rem;
  font-weight:900;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:#bfdbfe;
  background:rgba(59,130,246,0.14);
  border:1px solid rgba(59,130,246,0.28);
}

.legal-modal-title{
  margin-top:0.9rem;
  font-size:1.25rem;
  line-height:1.55rem;
  font-weight:900;
  color:#ffffff;
}

.legal-modal-copy{
  margin-top:0.55rem;
  color:rgba(255,255,255,0.74);
  font-size:0.9rem;
  line-height:1.55;
}

.legal-modal-links{
  margin-top:0.9rem;
  display:grid;
  gap:0.55rem;
}

.legal-modal-links a{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:0.8rem;
  min-height:42px;
  padding:0.75rem 0.85rem;
  border-radius:0.9rem;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  color:#dbeafe;
  font-size:0.86rem;
  font-weight:800;
}

.legal-modal-actions{
  margin-top:1rem;
}

.legal-modal-actions button{
  width:100%;
  min-height:46px;
  border-radius:0.95rem;
  border:1px solid rgba(255,255,255,0.10);
  background:rgb(79,70,229);
  color:#ffffff;
  font-size:0.9rem;
  font-weight:850;
  cursor:pointer;
}

.legal-modal-error{
  display:none;
  margin-top:0.8rem;
  padding:0.7rem 0.8rem;
  border-radius:0.85rem;
  background:rgba(239,68,68,0.12);
  border:1px solid rgba(239,68,68,0.28);
  color:#fecaca;
  font-size:0.78rem;
  line-height:1.45;
}

</style>

</head>

<body class="text-white min-h-screen flex items-center justify-center px-4">

<div id="loginBox" class="glass p-8 rounded-2xl w-80 hidden">

<div class="flex justify-center mb-4" style="display:flex;justify-content:center;margin-bottom:1rem;">
<img src="./chitrabookai-app-icon-512.png" alt="ChitraBook AI logo" class="w-16 h-16 rounded-full shadow-lg shadow-indigo-900/40" style="width:64px;height:64px;border-radius:9999px;display:block;box-shadow:0 12px 28px rgba(79,70,229,0.45);">
</div>

<h2 id="title" class="text-xl font-bold mb-6 text-center">
ChitraBook AI Login
</h2>

<form id="authForm">

<input
id="email"
type="email"
placeholder="Email"
class="w-full mb-4 p-3 rounded-lg bg-black/40"
required>

<input
id="password"
type="password"
placeholder="Password"
class="w-full mb-3 p-3 rounded-lg bg-black/40"
required>

<div id="forgotPasswordRow" class="helper-row">
<span id="forgotPasswordBtn" class="link text-sm">Forgot Password?</span>
</div>

<div id="legalAgreementRow" class="legal-agreement hidden">
<input id="legalAgreement" type="checkbox">
<label for="legalAgreement">
I agree to the
<a href="https://chitrabookai.in/terms" target="_blank" rel="noopener noreferrer">Terms &amp; Conditions</a>
and
<a href="https://chitrabookai.in/privacy-policy.html" target="_blank" rel="noopener noreferrer">Privacy Policy</a>.
</label>
</div>

<button
id="submitBtn"
type="submit"
class="w-full bg-indigo-600 hover:bg-indigo-700 p-3 rounded-lg">
Login
</button>

</form>

<div id="authFeedback" class="feedback info"></div>

<button
id="googleBtn"
type="button"
class="w-full mt-4 bg-white text-black p-3 rounded-lg flex items-center justify-center gap-2 hover:bg-gray-100">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
<path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 3l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
<path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 18.9 12 24 12c3 0 5.7 1.1 7.8 3l5.7-5.7C34.1 6.1 29.3 4 24 4c-7.7 0-14.3 4.3-17.7 10.7z"/>
<path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.5-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.8-3.3-11.5-8l-6.5 5C9.3 39.5 16.1 44 24 44z"/>
<path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.1-3.3 5.6-6 7.1l.1-.1 6.2 5.2C35.2 40.6 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
</svg>
Continue with Google
</button>

<p class="text-center text-sm mt-4">
<span id="toggleText">
Don't have an account?
</span>
<span id="toggleBtn" class="link">
Signup
</span>
</p>

<p class="legal-consent">
By continuing, you agree to
<a href="https://chitrabookai.in/terms" target="_blank" rel="noopener noreferrer">Terms &amp; Conditions</a>
and
<a href="https://chitrabookai.in/privacy-policy.html" target="_blank" rel="noopener noreferrer">Privacy Policy</a>.
</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<script type="module">

import { login, signup, googleLogin } from "./js/auth.js"

const CHITRABOOK_AI_ANDROID_VERSION_CODE = 1
const CHITRABOOK_AI_ANDROID_VERSION_NAME = "1.0"

const CHITRABOOK_LEGAL_TERMS_VERSION = "2026-07-24"
const CHITRABOOK_LEGAL_PRIVACY_VERSION = "2026-07-24"
const CHITRABOOK_LEGAL_REFUND_VERSION = "2026-07-24"

function isChitraBookNativeAndroidApp(){
try{
const ua = navigator.userAgent || ""
const isAndroid = /Android/i.test(ua)
const protocol = window.location.protocol || ""
const host = window.location.hostname || ""
const hasCapacitorBridge =
!!window.Capacitor ||
!!window.AndroidBridge ||
protocol === "capacitor:" ||
host === "localhost"

return isAndroid && hasCapacitorBridge
}catch(err){
return false
}
}

function toSafeVersionCode(value){
const code = Number(value)
return Number.isFinite(code) ? Math.floor(code) : 0
}

function showAppUpdateOverlay(versionInfo, forceUpdate){
const existing = document.getElementById("chitrabookAppUpdateOverlay")
if(existing){
existing.remove()
}

const updateTitle =
versionInfo?.update_title ||
(forceUpdate ? "Update required" : "Update available")

const updateMessage =
versionInfo?.update_message ||
(forceUpdate
? "Please update ChitraBook AI to continue."
: "A new version of ChitraBook AI is available.")

const updateUrl = String(versionInfo?.update_url || "").trim()

const overlay = document.createElement("div")
overlay.id = "chitrabookAppUpdateOverlay"
overlay.style.position = "fixed"
overlay.style.inset = "0"
overlay.style.zIndex = "2147483647"
overlay.style.display = "flex"
overlay.style.alignItems = "center"
overlay.style.justifyContent = "center"
overlay.style.padding = "1rem"
overlay.style.background = "rgba(2,6,23,0.88)"
overlay.style.backdropFilter = "blur(12px)"
overlay.style.color = "#ffffff"

overlay.innerHTML = `
  <div style="
    width:min(100%, 420px);
    border-radius:1.35rem;
    padding:1.2rem;
    background:rgba(15,23,42,0.98);
    border:1px solid rgba(255,255,255,0.12);
    box-shadow:0 28px 90px rgba(0,0,0,0.45);
    text-align:left;
  ">
    <div style="
      display:inline-flex;
      align-items:center;
      padding:0.36rem 0.7rem;
      border-radius:999px;
      font-size:0.7rem;
      font-weight:900;
      letter-spacing:0.12em;
      text-transform:uppercase;
      color:${forceUpdate ? "#fecaca" : "#bfdbfe"};
      background:${forceUpdate ? "rgba(239,68,68,0.14)" : "rgba(59,130,246,0.14)"};
      border:1px solid ${forceUpdate ? "rgba(239,68,68,0.28)" : "rgba(59,130,246,0.28)"};
    ">${forceUpdate ? "Update Required" : "Update Available"}</div>

    <div style="
      margin-top:0.9rem;
      font-size:1.25rem;
      line-height:1.55rem;
      font-weight:900;
      color:#ffffff;
    ">${updateTitle}</div>

    <div style="
      margin-top:0.55rem;
      color:rgba(255,255,255,0.74);
      font-size:0.9rem;
      line-height:1.55;
    ">${updateMessage}</div>

    <div style="
      margin-top:0.75rem;
      color:rgba(255,255,255,0.46);
      font-size:0.76rem;
      line-height:1.45;
    ">Installed version: ${CHITRABOOK_AI_ANDROID_VERSION_NAME}</div>

    <button id="chitrabookUpdateNowBtn" type="button" style="
      margin-top:1rem;
      width:100%;
      min-height:46px;
      border-radius:0.95rem;
      border:1px solid rgba(255,255,255,0.10);
      background:rgb(79,70,229);
      color:#ffffff;
      font-size:0.9rem;
      font-weight:850;
      cursor:pointer;
    ">Update Now</button>

    ${forceUpdate ? "" : `
      <button id="chitrabookUpdateLaterBtn" type="button" style="
        margin-top:0.65rem;
        width:100%;
        min-height:42px;
        border-radius:0.9rem;
        border:1px solid rgba(255,255,255,0.12);
        background:rgba(255,255,255,0.06);
        color:rgba(255,255,255,0.86);
        font-size:0.86rem;
        font-weight:750;
        cursor:pointer;
      ">Later</button>
    `}
  </div>
`

document.body.appendChild(overlay)

const updateBtn = document.getElementById("chitrabookUpdateNowBtn")
if(updateBtn){
updateBtn.onclick = function(){
if(updateUrl){
window.location.href = updateUrl
}else{
updateBtn.innerText = "Update link will be available soon"
updateBtn.disabled = true
updateBtn.style.opacity = "0.75"
}
}
}

const laterBtn = document.getElementById("chitrabookUpdateLaterBtn")
if(laterBtn){
laterBtn.onclick = function(){
overlay.remove()
}
}
}

async function checkChitraBookAndroidAppVersion(supabase){
if(!isChitraBookNativeAndroidApp()){
return true
}

try{
const { data, error } = await supabase
.from("app_versions")
.select("latest_version_name, latest_version_code, min_required_version_code, update_title, update_message, update_url, force_update, is_active")
.eq("platform", "android")
.eq("is_active", true)
.maybeSingle()

if(error){
console.warn("App version check failed:", error)
return true
}

if(!data){
return true
}

const currentCode = toSafeVersionCode(CHITRABOOK_AI_ANDROID_VERSION_CODE)
const latestCode = toSafeVersionCode(data.latest_version_code)
const minRequiredCode = toSafeVersionCode(data.min_required_version_code)

const mustForceUpdate =
currentCode < minRequiredCode ||
(data.force_update === true && currentCode < latestCode)

if(mustForceUpdate){
showAppUpdateOverlay(data, true)
return false
}

if(currentCode < latestCode){
showAppUpdateOverlay(data, false)
}

return true
}catch(err){
console.warn("App version check skipped:", err)
return true
}
}


function hasCurrentLegalAcceptance(record){
  return !!record &&
    record.terms_version === CHITRABOOK_LEGAL_TERMS_VERSION &&
    record.privacy_version === CHITRABOOK_LEGAL_PRIVACY_VERSION &&
    record.refund_version === CHITRABOOK_LEGAL_REFUND_VERSION
}

function getLegalPlatform(){
  return isChitraBookNativeAndroidApp() ? "android" : "web"
}

async function fetchUserLegalAcceptance(userId){
  const { data, error } = await supabase
    .from("user_legal_acceptances")
    .select("terms_version, privacy_version, refund_version, accepted_at")
    .eq("user_id", userId)
    .maybeSingle()

  if(error){
    console.warn("Legal acceptance check failed:", error)
    return null
  }

  return data
}

async function saveUserLegalAcceptance(user){
  if(!user?.id){
    throw new Error("Unable to save legal acceptance because user session is missing.")
  }

  const { error } = await supabase
    .from("user_legal_acceptances")
    .upsert({
      user_id: user.id,
      terms_version: CHITRABOOK_LEGAL_TERMS_VERSION,
      privacy_version: CHITRABOOK_LEGAL_PRIVACY_VERSION,
      refund_version: CHITRABOOK_LEGAL_REFUND_VERSION,
      platform: getLegalPlatform(),
      user_agent: navigator.userAgent || "",
      accepted_at: new Date().toISOString(),
      updated_at: new Date().toISOString()
    }, { onConflict: "user_id" })

  if(error){
    throw error
  }
}

function showLegalAcceptanceOverlay(user){
  return new Promise((resolve)=>{
    const existing = document.getElementById("chitrabookLegalOverlay")
    if(existing){
      existing.remove()
    }

    const overlay = document.createElement("div")
    overlay.id = "chitrabookLegalOverlay"
    overlay.className = "legal-overlay"

    overlay.innerHTML = `
      <div class="legal-modal">
        <div class="legal-modal-badge">Legal Update</div>
        <div class="legal-modal-title">Review Terms & Privacy</div>
        <div class="legal-modal-copy">
          Please review and accept ChitraBook AI Terms & Conditions, Privacy Policy and Refund & Cancellation Policy to continue using the app.
        </div>

        <div class="legal-modal-links">
          <a href="https://chitrabookai.in/terms" target="_blank" rel="noopener noreferrer">Terms & Conditions <span>↗</span></a>
          <a href="https://chitrabookai.in/privacy-policy.html" target="_blank" rel="noopener noreferrer">Privacy Policy <span>↗</span></a>
          <a href="https://chitrabookai.in/refund-policy.html" target="_blank" rel="noopener noreferrer">Refund & Cancellation Policy <span>↗</span></a>
        </div>

        <div id="legalAcceptError" class="legal-modal-error"></div>

        <div class="legal-modal-actions">
          <button id="legalAcceptBtn" type="button">Accept & Continue</button>
        </div>
      </div>
    `

    document.body.appendChild(overlay)

    const acceptBtn = document.getElementById("legalAcceptBtn")
    const errorBox = document.getElementById("legalAcceptError")

    acceptBtn.onclick = async function(){
      try{
        acceptBtn.disabled = true
        acceptBtn.innerText = "Saving..."
        errorBox.style.display = "none"
        errorBox.innerText = ""

        await saveUserLegalAcceptance(user)

        overlay.remove()
        resolve(true)
      }catch(error){
        console.error("Legal acceptance save failed:", error)
        acceptBtn.disabled = false
        acceptBtn.innerText = "Accept & Continue"
        errorBox.innerText = "Unable to save acceptance right now. Please check your internet connection and try again."
        errorBox.style.display = "block"
      }
    }
  })
}

async function continueAfterLegalAcceptance(session, redirectUrl){
  const user = session?.user

  if(!user?.id){
    throw new Error("Login session was not created.")
  }

  const acceptance = await fetchUserLegalAcceptance(user.id)

  if(hasCurrentLegalAcceptance(acceptance)){
    window.location.replace(redirectUrl)
    return
  }

  await showLegalAcceptanceOverlay(user)
  window.location.replace(redirectUrl)
}

function waitForSupabase(){
return new Promise(resolve=>{
const check = setInterval(()=>{
if(window.supabaseClient){
clearInterval(check)
resolve(window.supabaseClient)
}
},50)
})
}

function setFeedback(type, message){
const box = document.getElementById("authFeedback")
box.className = "feedback show"

if(type === "success"){
box.classList.add("success")
}else if(type === "error"){
box.classList.add("error")
}else{
box.classList.add("info")
}

box.innerText = message
}

function clearFeedback(){
const box = document.getElementById("authFeedback")
box.className = "feedback info"
box.innerText = ""
}

function getResetRedirectUrl(){
const current = window.location.href
const base = current.substring(0, current.lastIndexOf("/") + 1)
return `${base}reset-password.html`
}

const supabase = await waitForSupabase()

const appVersionAllowed = await checkChitraBookAndroidAppVersion(supabase)

if(appVersionAllowed){
const { data:{ session } } =
await supabase.auth.getSession()

if(session){
await continueAfterLegalAcceptance(session, "dashboard.html")
}else{
document.getElementById("loginBox").classList.remove("hidden")
}
}

let mode = "login"

const form = document.getElementById("authForm")
const title = document.getElementById("title")
const btn = document.getElementById("submitBtn")
const toggle = document.getElementById("toggleBtn")
const text = document.getElementById("toggleText")
const googleBtn = document.getElementById("googleBtn")
const passwordInput = document.getElementById("password")
const legalAgreementRow = document.getElementById("legalAgreementRow")
const legalAgreement = document.getElementById("legalAgreement")
const forgotPasswordRow = document.getElementById("forgotPasswordRow")
const forgotPasswordBtn = document.getElementById("forgotPasswordBtn")

function syncModeUi(){
clearFeedback()

if(mode==="login"){
title.innerText="ChitraBook AI Login"
btn.innerText="Login"
text.innerText="Don't have an account?"
toggle.innerText="Signup"
passwordInput.required = true
passwordInput.disabled = false
passwordInput.placeholder = "Password"
forgotPasswordRow.style.display = "flex"
legalAgreementRow.classList.add("hidden")
legalAgreement.checked = false
}else{
title.innerText="Create Account"
btn.innerText="Signup"
text.innerText="Already have an account?"
toggle.innerText="Login"
passwordInput.required = true
passwordInput.disabled = false
passwordInput.placeholder = "Password"
forgotPasswordRow.style.display = "none"
legalAgreementRow.classList.remove("hidden")
}
}

syncModeUi()

toggle.addEventListener("click",()=>{
mode = mode === "login" ? "signup" : "login"
syncModeUi()
})

forgotPasswordBtn.addEventListener("click", async ()=>{
clearFeedback()

const email = document.getElementById("email").value.trim()

if(!email){
setFeedback("error", "Please enter your email first to receive a password reset link.")
document.getElementById("email").focus()
return
}

try{
forgotPasswordBtn.style.pointerEvents = "none"
forgotPasswordBtn.style.opacity = "0.7"

const { error } = await supabase.auth.resetPasswordForEmail(email, {
redirectTo: getResetRedirectUrl()
})

forgotPasswordBtn.style.pointerEvents = ""
forgotPasswordBtn.style.opacity = ""

if(error){
console.error("Reset password request failed:", error)
setFeedback("error", error.message || "Unable to send password reset email right now.")
return
}

setFeedback("success", "Password reset link sent. Check your email and open the link to create a new password.")
}catch(err){
console.error("Reset password request crashed:", err)
forgotPasswordBtn.style.pointerEvents = ""
forgotPasswordBtn.style.opacity = ""
setFeedback("error", "Unexpected error while sending reset email.")
}
})

form.addEventListener("submit", async (e)=>{
e.preventDefault()
clearFeedback()

const email = document.getElementById("email").value.trim()
const password = document.getElementById("password").value

try{
btn.disabled = true
googleBtn.disabled = true

if(mode==="login"){
const { data, error } = await supabase.auth.signInWithPassword({
email,
password
})

if(error){
throw error
}

await continueAfterLegalAcceptance(data.session, "dashboard.html")
}else{
if(!legalAgreement.checked){
setFeedback("error", "Please accept Terms & Conditions and Privacy Policy to create your account.")
return
}

await signup(email,password)

const { data:{ session: signupSession } } =
await supabase.auth.getSession()

if(signupSession?.user){
await saveUserLegalAcceptance(signupSession.user)
await continueAfterLegalAcceptance(signupSession, "dashboard.html")
return
}

setFeedback("success", "Signup request submitted. Please check your email if confirmation is required.")
}
}catch(err){
console.error("Auth submit crashed:", err)
setFeedback("error", "Authentication failed. Please try again.")
}finally{
btn.disabled = false
googleBtn.disabled = false
}
})

googleBtn.addEventListener("click", async ()=>{
clearFeedback()

try{
googleBtn.disabled = true
btn.disabled = true
await googleLogin()
}catch(err){
console.error("Google login crashed:", err)
setFeedback("error", "Google login failed. Please try again.")
}finally{
googleBtn.disabled = false
btn.disabled = false
}
})

</script>

</body>
</html>
